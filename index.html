<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AX 실무 입문 · 사유의 방</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- 네온: 표제(Gowun Batang) · 테크 라벨(Orbitron) -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <!-- 공통 한글 본문: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <!-- 픽셀: Galmuri(한글 픽셀) + Press Start 2P(라틴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  <!-- 블루프린트: IBM Plex Sans KR + Space Grotesk · 픽셀 라틴: Press Start 2P -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Space+Grotesk:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <!-- 사유의 방: 명조(Nanum Myeongjo) -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 배경: 별/그리드 캔버스 -->
  <canvas id="bg-canvas"></canvas>
  <div class="vignette"></div>

  <!-- ================= SCENE 1 : 시작 ================= -->
  <section id="scene-start" class="scene is-active">
    <div class="start-inner">
      <p class="start-kicker">AI TRANSFORMATION · 20강</p>
      <h1 class="start-title">사유의 방</h1>
      <p class="start-sub">생각의 순서를 바꾸는 20강의 여정</p>
      <button id="enter-btn" class="enter-btn">
        <span class="enter-btn__label">강의실 입장</span>
        <span class="enter-btn__glow"></span>
      </button>
      <p class="start-hint">클릭하여 사유의 방으로 입장합니다</p>

      <!-- 스킨(테마) 선택기 -->
      <div class="skin-picker" id="skin-picker" role="group" aria-label="테마 선택">
        <button class="skin-opt" type="button" data-skin="sayu" aria-pressed="true">
          <span class="skin-sw skin-sw--sayu"></span><span class="skin-lb">사유의 방</span>
        </button>
        <button class="skin-opt" type="button" data-skin="paper" aria-pressed="false">
          <span class="skin-sw skin-sw--paper"></span><span class="skin-lb">페이퍼</span>
        </button>
        <button class="skin-opt" type="button" data-skin="neon" aria-pressed="false">
          <span class="skin-sw skin-sw--neon"></span><span class="skin-lb">네온</span>
        </button>
        <button class="skin-opt" type="button" data-skin="pixel" aria-pressed="false">
          <span class="skin-sw skin-sw--pixel"></span><span class="skin-lb">픽셀</span>
        </button>
        <button class="skin-opt" type="button" data-skin="blueprint" aria-pressed="false">
          <span class="skin-sw skin-sw--blueprint"></span><span class="skin-lb">블루프린트</span>
        </button>
      </div>
    </div>
  </section>

  <!-- 입장 워프 오버레이 -->
  <div id="warp" class="warp"></div>

  <!-- ================= SCENE 2 : 사유의 방 ================= -->
  <section id="scene-room" class="scene">
    <!-- 게이미피케이션 HUD -->
    <header class="hud">
      <div class="hud__left">
        <span class="hud__logo">사유의 방</span>
      </div>
      <div class="hud__right">
        <div class="hud__stat">
          <span class="hud__label">발견한 강의</span>
          <span class="hud__value"><span id="found-count">0</span> / 20</span>
        </div>
        <div class="hud__xp">
          <div class="hud__xp-bar"><span id="xp-fill"></span></div>
          <span class="hud__xp-label">탐험도 <span id="xp-pct">0</span>%</span>
        </div>
        <button id="reset-progress" class="hud__reset" title="진행도 초기화">↺</button>
      </div>
    </header>

    <div class="room-inner">
      <p class="room-guide" id="room-guide">사유의 상자 하나를 열어보세요</p>
      <div id="boxes" class="boxes"><!-- 상자 4개 JS 생성 --></div>
    </div>

    <!-- 카드 부채꼴 오버레이 -->
    <div id="fan-overlay" class="fan-overlay">
      <button class="fan-close" id="fan-close">✕ 상자 닫기</button>
      <p class="fan-title" id="fan-title"></p>
      <div id="fan-cards" class="fan-cards"><!-- 카드 5개 JS 생성 --></div>
      <p class="fan-hint">카드를 선택해 강의실로 입장</p>
    </div>
  </section>

  <!-- ================= SCENE 3 : 강의 슬라이드 ================= -->
  <section id="scene-slides" class="scene">
    <header class="slide-topbar">
      <button id="slide-exit" class="slide-exit">← 사유의 방</button>
      <span id="slide-lecture-name" class="slide-lecture-name"></span>
      <span id="slide-counter" class="slide-counter">1 / 1</span>
    </header>
    <div class="slide-progress"><span id="slide-progress-fill"></span></div>

    <div id="slide-stage" class="slide-stage"><!-- 슬라이드 JS 렌더 --></div>

    <div class="slide-nav">
      <button id="slide-prev" class="slide-btn">◀ 이전</button>
      <div id="slide-dots" class="slide-dots"></div>
      <button id="slide-next" class="slide-btn">다음 ▶</button>
    </div>
  </section>

  <!-- 스크립트: 순서 중요 -->
  <script src="js/data.js"></script>
  <script src="js/room.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
