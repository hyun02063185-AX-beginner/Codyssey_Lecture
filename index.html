<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AX 실무 입문 · 사유의 방</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- 네온: 표제(Gowun Batang) · 테크 라벨(Orbitron) -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <!-- 공통 한글 본문: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <!-- 픽셀: Galmuri(한글 픽셀) + Press Start 2P(라틴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  <!-- 블루프린트: IBM Plex Sans KR + Space Grotesk · 픽셀 라틴: Press Start 2P -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Space+Grotesk:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <!-- 사유의 방: 명조(Nanum Myeongjo) -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet" />
  <!-- 페이퍼: 손글씨(개구/Gaegu) -->
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 배경: 별/그리드 캔버스 -->
  <canvas id="bg-canvas"></canvas>
  <div class="vignette"></div>

  <!-- ================= SCENE 0 : 인트로(4테마 화면보호기) ================= -->
  <section id="scene-intro" class="scene is-active" aria-label="인트로 — 화면보호기 테마를 고르세요">
    <!-- 4분할 랜딩 -->
    <div id="intro-grid" class="intro-grid" role="group" aria-label="화면보호기 테마 4종">
      <button class="intro-cell" type="button" data-theme="star" aria-label="별똥별 테마 선택">
        <canvas class="intro-cell__cv"></canvas><span class="intro-cell__lb">별똥별</span>
      </button>
      <button class="intro-cell" type="button" data-theme="sakura" aria-label="벚꽃 테마 선택">
        <canvas class="intro-cell__cv"></canvas><span class="intro-cell__lb">벚꽃</span>
      </button>
      <button class="intro-cell" type="button" data-theme="fireworks" aria-label="불꽃놀이 테마 선택">
        <canvas class="intro-cell__cv"></canvas><span class="intro-cell__lb">불꽃놀이</span>
      </button>
      <button class="intro-cell" type="button" data-theme="snow" aria-label="함박눈 테마 선택">
        <canvas class="intro-cell__cv"></canvas><span class="intro-cell__lb">함박눈</span>
      </button>
    </div>
    <!-- 선택 후 전체화면(화면보호기) -->
    <div id="intro-full" class="intro-full" tabindex="-1" aria-label="화면을 클릭하면 입장" hidden>
      <canvas id="intro-full-cv" class="intro-full__cv"></canvas>
      <button id="intro-back" class="intro-back" type="button">🎨 테마 고르기</button>
      <p id="intro-enter" class="intro-enter">화면을 클릭하면 입장</p>
    </div>
  </section>

  <!-- ================= SCENE 1 : 시작 ================= -->
  <section id="scene-start" class="scene">
    <div class="start-inner">
      <p class="start-kicker">AI TRANSFORMATION · 20강</p>
      <h1 class="start-title">사유의 방</h1>
      <p class="start-sub">생각의 순서를 바꾸는 20강의 여정</p>
      <button id="enter-btn" class="enter-btn">
        <span class="enter-btn__label">강의실 입장</span>
        <span class="enter-btn__glow"></span>
      </button>
      <p class="start-hint">클릭하여 사유의 방으로 입장합니다</p>

      <!-- 수강 코드(선택) — 입력 시에만 학습 현황이 강사에게 전송된다 (telemetry.js) -->
      <div class="scode" id="scode">
        <div class="scode__row" id="scode-form">
          <input id="scode-input" class="scode__input" type="text" maxlength="20"
                 placeholder="수강 코드 (선택)" autocomplete="off" />
          <button id="scode-set" class="scode__btn" type="button">등록</button>
        </div>
        <div class="scode__row" id="scode-active" hidden>
          <span class="scode__badge">🎫 <b id="scode-current"></b></span>
          <button id="scode-clear" class="scode__btn scode__btn--ghost" type="button">제거</button>
        </div>
        <p class="scode__note">코드를 입력하면 학습 진행 상황이 강사에게 전달됩니다</p>
      </div>

      <!-- 스킨(테마) 선택기 -->
      <div class="skin-picker" id="skin-picker" role="group" aria-label="테마 선택">
        <button class="skin-opt" type="button" data-skin="sayu" aria-pressed="true">
          <span class="skin-sw skin-sw--sayu"></span><span class="skin-lb">사유의 방</span>
        </button>
        <button class="skin-opt" type="button" data-skin="paper" aria-pressed="false">
          <span class="skin-sw skin-sw--paper"></span><span class="skin-lb">페이퍼</span>
        </button>
        <button class="skin-opt" type="button" data-skin="neon" aria-pressed="false">
          <span class="skin-sw skin-sw--neon"></span><span class="skin-lb">네온</span>
        </button>
        <button class="skin-opt" type="button" data-skin="pixel" aria-pressed="false">
          <span class="skin-sw skin-sw--pixel"></span><span class="skin-lb">픽셀</span>
        </button>
        <button class="skin-opt" type="button" data-skin="blueprint" aria-pressed="false">
          <span class="skin-sw skin-sw--blueprint"></span><span class="skin-lb">블루프린트</span>
        </button>
      </div>

      <!-- 실습실 입장 문 (Lv.2 해금 · 읽기만) -->
      <button id="practice-door" class="pdoor" type="button">
        <span class="pdoor-ic">🧪</span>
        <span class="pdoor-txt">
          <span class="pdoor-t">진단실 입장</span>
          <span class="pdoor-state">…</span>
        </span>
        <span class="pdoor-arrow">→</span>
      </button>
    </div>
  </section>

  <!-- 입장 워프 오버레이 -->
  <div id="warp" class="warp"></div>

  <!-- ================= SCENE 2 : 사유의 방 ================= -->
  <section id="scene-room" class="scene">
    <!-- 게이미피케이션 HUD -->
    <header class="hud">
      <div class="hud__left">
        <button id="to-start" class="hud__home" title="입장 화면으로">⌂ 입장</button>
        <span class="hud__logo">사유의 방</span>
      </div>
      <div class="hud__right">
        <span class="hud__rank" id="hud-rank" hidden></span>
        <div class="hud__stat">
          <span class="hud__label">발견한 강의</span>
          <span class="hud__value"><span id="found-count">0</span> / 20</span>
        </div>
        <div class="hud__xp">
          <div class="hud__xp-bar"><span id="xp-fill"></span></div>
          <span class="hud__xp-label">탐험도 <span id="xp-pct">0</span>%</span>
        </div>
        <button id="toc-btn" class="hud__reset hud__toc" title="전체 목차 · 핵심 훑기">☰</button>
        <button id="reset-progress" class="hud__reset" title="진행도 초기화">↺</button>
      </div>
    </header>

    <div class="room-inner">
      <p class="room-guide" id="room-guide">사유의 상자 하나를 열어보세요</p>
      <div id="boxes" class="boxes"><!-- 상자 4개 JS 생성 --></div>
    </div>

    <!-- 카드 부채꼴 오버레이 -->
    <div id="fan-overlay" class="fan-overlay">
      <button class="fan-close" id="fan-close">✕ 상자 닫기</button>
      <p class="fan-title" id="fan-title"></p>
      <div id="fan-cards" class="fan-cards"><!-- 카드 5개 JS 생성 --></div>
      <p class="fan-hint">카드를 선택해 강의실로 입장</p>
    </div>
  </section>

  <!-- ================= SCENE 3 : 강의 슬라이드 ================= -->
  <section id="scene-slides" class="scene">
    <header class="slide-topbar">
      <button id="slide-exit" class="slide-exit">← 사유의 방</button>
      <span id="slide-lecture-name" class="slide-lecture-name"></span>
      <span id="slide-counter" class="slide-counter">1 / 1</span>
    </header>
    <div class="slide-progress"><span id="slide-progress-fill"></span></div>

    <div id="slide-stage" class="slide-stage"><!-- 슬라이드 JS 렌더 --></div>

    <div class="slide-nav">
      <button id="slide-prev" class="slide-btn">◀ 이전</button>
      <div id="slide-dots" class="slide-dots"></div>
      <button id="slide-next" class="slide-btn">다음 ▶</button>
    </div>
  </section>

  <!-- ================= SCENE 4 : 실습실 (목업) ================= -->
  <section id="scene-practice" class="scene"><!-- practice.js 렌더 --></section>

  <!-- scene 밖(body 직계)에 둔다: .scene 은 transform 전환이 걸려 있어
       내부에 두면 position:fixed 의 컨테이닝 블록이 씬으로 바뀌어 뷰포트 기준 고정이 깨진다 -->
  <div id="rotate-hint" class="rotate-hint" hidden>
    <span class="rotate-hint__icon">↻</span>
    <span class="rotate-hint__text">기기를 <b>가로</b>로 돌리면 더 넓게 볼 수 있어요</span>
    <button id="rotate-hint-close" class="rotate-hint__close" aria-label="닫기">✕</button>
  </div>

  <!-- 전체 목차 · 핵심 훑기 오버레이 (내용은 main.js가 렌더) -->
  <div id="toc" class="toc" hidden>
    <div class="toc__box">
      <header class="toc__head">
        <span class="toc__title">전체 목차</span>
        <button id="toc-core" class="toc__core" aria-pressed="false">⚡ 핵심 훑기</button>
        <button id="toc-close" class="toc__x" title="닫기">✕</button>
      </header>
      <div id="toc-list" class="toc__list"></div>
    </div>
  </div>

  <!-- 완주 축하 오버레이 -->
  <div id="celebrate" class="celebrate" hidden>
    <canvas id="celebrate-cv" class="celebrate__cv"></canvas>
    <div class="celebrate__inner">
      <p class="celebrate__kicker">AX 20강 · 완주</p>
      <p class="celebrate__title" id="celebrate-title">훌륭히 완주하셨습니다.</p>
      <p class="celebrate__sub" id="celebrate-sub">20강 완주</p>
      <div class="celebrate__btns">
        <button id="celebrate-up" class="celebrate__up">⬆ 업그레이드</button>
        <button id="celebrate-close" class="celebrate__close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 스크립트: 순서 중요 -->
  <script src="js/data.js"></script>
  <script src="js/room.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/main.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/telemetry.js"></script>
</body>
</html>
