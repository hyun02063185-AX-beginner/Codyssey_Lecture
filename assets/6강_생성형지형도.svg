<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">생성형 AI 지형도</title>
  <desc id="d">생성형 AI를 출력물(글·이미지·음성·영상·코드)로 분류하고, 찾는 AI와 만드는 AI로 나눈 뒤, 앞으로 배울 도구(07 지식검색, 08 에이전트, 09 자동화, 10 스택)의 위치를 보여주는 지도.</desc>
  <defs>
    <style><![CDATA[
      :root{ --bg:#171009; --grp:#1F1710; --card:#271C12; --edge:#4A3B2A;
             --ink:#EDE4D6; --dim:#B5A48D; --go:#E0C58A; }
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:var(--ink);font-weight:700;} .ts{fill:var(--dim);}
      .pl{fill:var(--go);font-weight:700;} .lbl{fill:var(--ink);font-weight:600;} .sub{fill:var(--dim);}
      .card{fill:var(--card);stroke:var(--edge);stroke-width:1.5;}
      .band{fill:var(--grp);stroke:var(--edge);stroke-width:1;}
      .chipgo{fill:#2E2013;stroke:var(--go);stroke-width:1.6;}
      .chip{fill:var(--card);stroke:var(--edge);stroke-width:1;}
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="var(--bg)"/>

  <!-- header -->
  <text x="48" y="58" font-size="30" class="tt">생성형 AI 지형도</text>
  <text x="50" y="90" font-size="16" class="ts">도구가 많아 보여도 — <tspan fill="#EDE4D6" font-weight="600">"무엇을 만드나"로 나누면 지도가 보인다</tspan></text>

  <!-- ① 출력물 분류 -->
  <text x="48" y="134" font-size="15.5" class="pl">① 무엇을 만드나 — 출력물이 곧 분류</text>
  <rect x="48" y="148" width="220" height="90" rx="12" class="card"/>
  <text x="158" y="186" font-size="17" text-anchor="middle" class="lbl">글</text>
  <text x="158" y="212" font-size="12" text-anchor="middle" class="sub">답변 · 요약 · 초안</text>
  <rect x="286" y="148" width="220" height="90" rx="12" class="card"/>
  <text x="396" y="186" font-size="17" text-anchor="middle" class="lbl">이미지</text>
  <text x="396" y="212" font-size="12" text-anchor="middle" class="sub">시안 · 썸네일</text>
  <rect x="524" y="148" width="220" height="90" rx="12" class="card"/>
  <text x="634" y="186" font-size="17" text-anchor="middle" class="lbl">음성</text>
  <text x="634" y="212" font-size="12" text-anchor="middle" class="sub">더빙 · 회의록 받아쓰기</text>
  <rect x="762" y="148" width="220" height="90" rx="12" class="card"/>
  <text x="872" y="186" font-size="17" text-anchor="middle" class="lbl">영상</text>
  <text x="872" y="212" font-size="12" text-anchor="middle" class="sub">클립 · 자막</text>
  <rect x="1000" y="148" width="220" height="90" rx="12" class="card"/>
  <text x="1110" y="186" font-size="17" text-anchor="middle" class="lbl">코드</text>
  <text x="1110" y="212" font-size="12" text-anchor="middle" class="sub">자동화 스크립트</text>

  <!-- 원리 한 줄 -->
  <rect x="48" y="262" width="1188" height="56" rx="12" class="band"/>
  <text x="72" y="297" font-size="15" class="lbl">원리는 하나 — 전부 <tspan fill="#E0C58A">"가장 그럴듯한 다음"</tspan>을 만든다 · 그래서 자신 있게 틀리기도 한다 <tspan class="sub" font-size="13">(03강 · 믿되 검증)</tspan></text>

  <!-- ② 찾는 vs 만드는 -->
  <text x="48" y="354" font-size="15.5" class="pl">② 찾는 AI vs 만드는 AI</text>
  <rect x="48" y="368" width="576" height="140" rx="13" class="card"/>
  <text x="336" y="406" font-size="18" text-anchor="middle" class="lbl">찾는 AI</text>
  <text x="336" y="431" font-size="13" text-anchor="middle" class="sub">이미 있는 걸 꺼낸다</text>
  <rect x="120" y="448" width="432" height="42" rx="21" class="chipgo"/>
  <text x="336" y="475" font-size="13.5" text-anchor="middle" class="lbl">검색 · 지식검색(RAG) → 07강에서</text>

  <rect x="660" y="368" width="576" height="140" rx="13" class="card"/>
  <text x="948" y="406" font-size="18" text-anchor="middle" class="lbl">만드는 AI</text>
  <text x="948" y="431" font-size="13" text-anchor="middle" class="sub">없던 걸 만든다</text>
  <rect x="732" y="448" width="432" height="42" rx="21" class="chip"/>
  <text x="948" y="475" font-size="13.5" text-anchor="middle" class="sub">글 · 이미지 · 영상 · 코드 생성 → 위의 지도</text>

  <!-- ③ 로드맵 -->
  <rect x="48" y="536" width="1188" height="104" rx="14" class="band"/>
  <text x="72" y="564" font-size="14" class="pl">③ 앞으로 갈 길 — 이 지도 위 우리의 여정</text>
  <rect x="72" y="578" width="258" height="46" rx="12" class="chipgo"/>
  <text x="201" y="607" font-size="13" text-anchor="middle" class="lbl">07 지식검색 — 찾기</text>
  <text x="349" y="606" font-size="14" text-anchor="middle" class="sub">→</text>
  <rect x="368" y="578" width="258" height="46" rx="12" class="chip"/>
  <text x="497" y="607" font-size="13" text-anchor="middle" class="lbl">08 에이전트 — 행동</text>
  <text x="645" y="606" font-size="14" text-anchor="middle" class="sub">→</text>
  <rect x="664" y="578" width="258" height="46" rx="12" class="chip"/>
  <text x="793" y="607" font-size="13" text-anchor="middle" class="lbl">09 자동화 — 반복</text>
  <text x="941" y="606" font-size="14" text-anchor="middle" class="sub">→</text>
  <rect x="960" y="578" width="258" height="46" rx="12" class="chip"/>
  <text x="1089" y="607" font-size="13" text-anchor="middle" class="lbl">10 나만의 스택 — 조합</text>

  <text x="48" y="682" font-size="14" class="sub">종류가 달라도 대하는 태도는 같다 — 믿되, 검증한다.</text>
</svg>
