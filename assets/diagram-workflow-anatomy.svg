<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">업무 해부도 — 수집, 정리, 초안, 검토, 발송</title>
  <desc id="d">가로 5단계 파이프라인: 수집(자동화), 정리(AI), 초안(AI), 검토(사람, 골드 테두리), 발송(사람+확인 지점, 골드 강조). 단계마다 묻는다 — 사람인가 AI인가 자동화인가, 그리고 어디서 멈추나.</desc>
  <defs>
    <marker id="ac" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#8FC7D8"/></marker>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#EDE4D6;font-weight:700;} .ts{fill:#B5A48D;}
      .lbl{fill:#EDE4D6;font-weight:700;} .sub{fill:#B5A48D;}
      .step{fill:#271C12;stroke:#4A3B2A;stroke-width:1.6;}
      .human{fill:#2A2113;stroke:#E0C58A;stroke-width:2.4;}
      .who{fill:#241A10;stroke:#4A3B2A;stroke-width:1.2;}
      .whoOn{fill:#2A2113;stroke:#E0C58A;stroke-width:1.8;}
      .flow{fill:none;stroke:#8FC7D8;stroke-width:2.4;}
      .gate{fill:none;stroke:#E0C58A;stroke-width:2;stroke-dasharray:6 6;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#171009"/>
  <text x="48" y="64" font-size="30" class="tt">업무 해부도</text>
  <text x="50" y="96" font-size="16" class="ts">업무를 단계로 쪼개고, 단계마다 담당을 정한다</text>

  <!-- 5단계 파이프라인 -->
  <rect x="60"  y="250" width="200" height="120" rx="16" class="step"/>
  <text x="160" y="300" font-size="20" text-anchor="middle" class="lbl">수집</text>
  <text x="160" y="330" font-size="12.5" text-anchor="middle" class="sub">자료·입력 모으기</text>
  <path d="M260 310 L300 310" class="flow" marker-end="url(#ac)"/>

  <rect x="308" y="250" width="200" height="120" rx="16" class="step"/>
  <text x="408" y="300" font-size="20" text-anchor="middle" class="lbl">정리</text>
  <text x="408" y="330" font-size="12.5" text-anchor="middle" class="sub">추리고 다듬기</text>
  <path d="M508 310 L548 310" class="flow" marker-end="url(#ac)"/>

  <rect x="556" y="250" width="200" height="120" rx="16" class="step"/>
  <text x="656" y="300" font-size="20" text-anchor="middle" class="lbl">초안</text>
  <text x="656" y="330" font-size="12.5" text-anchor="middle" class="sub">문서·답변 만들기</text>
  <path d="M756 310 L796 310" class="flow" marker-end="url(#ac)"/>

  <rect x="804" y="250" width="200" height="120" rx="16" class="human"/>
  <text x="904" y="300" font-size="20" text-anchor="middle" fill="#E0C58A" font-weight="700">검토</text>
  <text x="904" y="330" font-size="12.5" text-anchor="middle" class="sub">숫자·판단·책임</text>
  <path d="M1004 310 L1044 310" class="flow" marker-end="url(#ac)"/>

  <rect x="1052" y="250" width="170" height="120" rx="16" class="human"/>
  <text x="1137" y="300" font-size="20" text-anchor="middle" fill="#E0C58A" font-weight="700">발송</text>
  <text x="1137" y="330" font-size="12.5" text-anchor="middle" class="sub">외부로 나간다</text>

  <!-- 담당 라벨 -->
  <rect x="85"  y="410" width="150" height="52" rx="26" class="who"/>
  <text x="160" y="443" font-size="15" text-anchor="middle" class="lbl">🤖 자동화</text>
  <rect x="333" y="410" width="150" height="52" rx="26" class="who"/>
  <text x="408" y="443" font-size="15" text-anchor="middle" class="lbl">🤖 AI</text>
  <rect x="581" y="410" width="150" height="52" rx="26" class="who"/>
  <text x="656" y="443" font-size="15" text-anchor="middle" class="lbl">🤖 AI</text>
  <rect x="829" y="410" width="150" height="52" rx="26" class="whoOn"/>
  <text x="904" y="443" font-size="15" text-anchor="middle" fill="#E0C58A" font-weight="700">👤 사람</text>
  <rect x="1042" y="410" width="190" height="52" rx="26" class="whoOn"/>
  <text x="1137" y="443" font-size="14.5" text-anchor="middle" fill="#E0C58A" font-weight="700">👤 사람 + 🙋 확인</text>

  <!-- 담당→단계 연결 점선 -->
  <line x1="160" y1="410" x2="160" y2="374" class="gate" opacity=".4"/>
  <line x1="408" y1="410" x2="408" y2="374" class="gate" opacity=".4"/>
  <line x1="656" y1="410" x2="656" y2="374" class="gate" opacity=".4"/>
  <line x1="904" y1="410" x2="904" y2="374" class="gate"/>
  <line x1="1137" y1="410" x2="1137" y2="374" class="gate"/>

  <!-- 멈춤 지점 강조 -->
  <text x="1137" y="510" font-size="13.5" text-anchor="middle" fill="#E0C58A">↑ 여기서 멈춘다</text>
  <text x="1137" y="530" font-size="12" text-anchor="middle" class="sub">되돌리기 어려운 단계</text>

  <!-- 보조 문구 -->
  <rect x="180" y="600" width="920" height="66" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="640" y="628" font-size="17" text-anchor="middle" class="lbl">단계마다 묻는다 — <tspan fill="#8FC7D8">사람? AI? 자동화?</tspan></text>
  <text x="640" y="654" font-size="14" text-anchor="middle" class="sub">그리고 — <tspan fill="#E0C58A" font-weight="700">어디서 멈추나</tspan></text>
</svg>
