<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">RAG vs DB 검색 — 같은 "전부 가져와" 명령, 다른 결과</title>
  <desc id="d">같은 "혈액형 문제 전부" 명령을 줘도, RAG는 질문과 유사도가 가까운 상위 top_k개(20개라도 5~7개)만 가져온다. RAG는 '전수'가 아니라 '유사도 순위 몇 개'를 뽑는 도구이기 때문이다. DB 검색은 조건에 맞는 항목을 빠짐없이 전부 가져와 PDF로 만든다. '전부 뽑기'는 top_k를 키워 해결되는 문제가 아니라, 도구의 성격이 다른 문제다.</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#E0C58A"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#D98E6B"/></marker>
    <style><![CDATA[
      :root{ --bg:#171009; --grp:#1F1710; --card:#271C12; --edge:#4A3B2A;
             --ink:#EDE4D6; --dim:#B5A48D; --go:#E0C58A; --gold:#D98E6B; }
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:var(--ink);font-weight:700;} .ts{fill:var(--dim);}
      .lbl{fill:var(--ink);font-weight:700;} .sub{fill:var(--dim);}
      .card{fill:var(--card);stroke:var(--edge);stroke-width:1.5;}
      .go{fill:#2A2113;stroke:var(--go);stroke-width:2;}
      .cop{fill:#2A1A12;stroke:var(--gold);stroke-width:2;}
      .box{fill:var(--grp);stroke:var(--edge);stroke-width:1;}
      .chunk{fill:var(--card);stroke:var(--edge);stroke-width:1;}
      .chunkOn{fill:#3A2E17;stroke:var(--go);stroke-width:1.6;}
      .rowOn{fill:#3A2416;stroke:var(--gold);stroke-width:1.4;}
      .egold{fill:none;stroke:#E0C58A;stroke-width:2.4;} .ecop{fill:none;stroke:#D98E6B;stroke-width:2.4;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="var(--bg)"/>
  <text x="48" y="56" font-size="28" class="tt">RAG vs DB 검색 <tspan font-size="17" class="ts">· 같은 "전부 가져와" 명령, 다른 결과</tspan></text>
  <line x1="640" y1="92" x2="640" y2="582" stroke="#4A3B2A" stroke-width="1" stroke-dasharray="4 7"/>

  <!-- ===== 왼쪽: RAG ===== -->
  <rect x="180" y="100" width="300" height="46" rx="23" class="go"/>
  <text x="330" y="129" font-size="18" text-anchor="middle" class="lbl">RAG · 지식검색 (7강)</text>
  <rect x="200" y="170" width="260" height="42" rx="21" class="card"/>
  <text x="330" y="197" font-size="15" text-anchor="middle" class="sub">"혈액형 문제 전부"</text>
  <path d="M330 214 L330 252" class="egold" marker-end="url(#ah)"/>

  <!-- 청크 20개 중 유사도 상위 몇 개(top_k)만 강조 -->
  <rect x="150" y="260" width="360" height="150" rx="12" class="box"/>
  <text x="164" y="278" font-size="12" class="sub">혈액형 문제 20개</text>
  <rect x="165" y="288" width="56" height="24" rx="5" class="chunk"/>
  <rect x="233" y="288" width="56" height="24" rx="5" class="chunkOn"/>
  <rect x="301" y="288" width="56" height="24" rx="5" class="chunk"/>
  <rect x="369" y="288" width="56" height="24" rx="5" class="chunkOn"/>
  <rect x="437" y="288" width="56" height="24" rx="5" class="chunk"/>
  <rect x="165" y="318" width="56" height="24" rx="5" class="chunkOn"/>
  <rect x="233" y="318" width="56" height="24" rx="5" class="chunk"/>
  <rect x="301" y="318" width="56" height="24" rx="5" class="chunk"/>
  <rect x="369" y="318" width="56" height="24" rx="5" class="chunk"/>
  <rect x="437" y="318" width="56" height="24" rx="5" class="chunkOn"/>
  <rect x="165" y="348" width="56" height="24" rx="5" class="chunk"/>
  <rect x="233" y="348" width="56" height="24" rx="5" class="chunk"/>
  <rect x="301" y="348" width="56" height="24" rx="5" class="chunkOn"/>
  <rect x="369" y="348" width="56" height="24" rx="5" class="chunk"/>
  <rect x="437" y="348" width="56" height="24" rx="5" class="chunk"/>
  <rect x="165" y="378" width="56" height="24" rx="5" class="chunk"/>
  <rect x="233" y="378" width="56" height="24" rx="5" class="chunkOn"/>
  <rect x="301" y="378" width="56" height="24" rx="5" class="chunk"/>
  <rect x="369" y="378" width="56" height="24" rx="5" class="chunk"/>
  <rect x="437" y="378" width="56" height="24" rx="5" class="chunk"/>
  <text x="330" y="446" font-size="15.5" text-anchor="middle" class="lbl">유사도 상위 <tspan fill="#E0C58A">top_k개</tspan>만 (20개라도 5~7개)</text>
  <path d="M330 456 L330 486" class="egold" marker-end="url(#ah)"/>
  <rect x="185" y="494" width="290" height="46" rx="12" class="card"/>
  <text x="330" y="523" font-size="15" text-anchor="middle" class="sub">→ 일부만 · <tspan fill="#E0C58A">'전수'가 아니다</tspan></text>

  <!-- ===== 오른쪽: DB ===== -->
  <rect x="800" y="100" width="300" height="46" rx="23" class="cop"/>
  <text x="950" y="129" font-size="18" text-anchor="middle" class="lbl">DB 검색 · 조건 필터</text>
  <rect x="820" y="170" width="260" height="42" rx="21" class="card"/>
  <text x="950" y="197" font-size="15" text-anchor="middle" class="sub">"혈액형 문제 전부"</text>
  <path d="M950 214 L950 252" class="ecop" marker-end="url(#ac)"/>

  <!-- 표: 조건 맞는 행 전부(빠짐없이) 강조 -->
  <rect x="770" y="260" width="360" height="150" rx="12" class="box"/>
  <text x="784" y="278" font-size="12" class="sub">조건 = 혈액형</text>
  <rect x="788" y="288" width="324" height="24" rx="5" class="rowOn"/>
  <rect x="788" y="318" width="324" height="24" rx="5" class="rowOn"/>
  <rect x="788" y="348" width="324" height="24" rx="5" class="rowOn"/>
  <rect x="788" y="378" width="324" height="24" rx="5" class="rowOn"/>
  <text x="950" y="446" font-size="15.5" text-anchor="middle" class="lbl">조건 맞는 걸 <tspan fill="#D98E6B">전부</tspan> (빠짐없이)</text>
  <path d="M950 456 L950 486" class="ecop" marker-end="url(#ac)"/>
  <rect x="815" y="494" width="270" height="46" rx="12" class="cop"/>
  <text x="950" y="523" font-size="15.5" text-anchor="middle" class="lbl">→ 전수 목록 → PDF</text>

  <!-- 하단 결론 -->
  <rect x="90" y="606" width="1100" height="58" rx="14" fill="var(--grp)" stroke="var(--edge)" stroke-width="1"/>
  <text x="640" y="642" font-size="16" text-anchor="middle" class="lbl">시나리오에 맞는 도구를 고른다 — <tspan fill="#D98E6B">'전부 뽑기'</tspan>는 top_k 키우기가 아니라 <tspan fill="#D98E6B">DB의 몫</tspan></text>
</svg>
