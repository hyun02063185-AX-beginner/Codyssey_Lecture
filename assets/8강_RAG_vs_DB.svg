<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">RAG vs DB 검색 — 시나리오가 도구를 고른다</title>
  <desc id="d">RAG(지식검색)는 질문과 뜻이 가까운 조각을 몇 개만 골라와 요약·근거로 답한다. DB 검색은 조건에 맞는 항목을 전부 가져와 목록·PDF로 만든다. 과학문제은행처럼 '전부 뽑아 PDF'는 RAG가 아니라 DB가 맞다.</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#E0C58A"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#D98E6B"/></marker>
    <style><![CDATA[
      :root{ --bg:#171009; --grp:#1F1710; --card:#271C12; --edge:#4A3B2A;
             --ink:#EDE4D6; --dim:#B5A48D; --go:#E0C58A; --gold:#D98E6B; }
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:var(--ink);font-weight:700;} .ts{fill:var(--dim);}
      .lbl{fill:var(--ink);font-weight:700;} .sub{fill:var(--dim);}
      .card{fill:var(--card);stroke:var(--edge);stroke-width:1.5;}
      .go{fill:#2A2113;stroke:var(--go);stroke-width:2;}
      .cop{fill:#2A1A12;stroke:var(--gold);stroke-width:2;}
      .box{fill:var(--grp);stroke:var(--edge);stroke-width:1;}
      .chunk{fill:var(--card);stroke:var(--edge);stroke-width:1;}
      .chunkOn{fill:#3A2E17;stroke:var(--go);stroke-width:1.6;}
      .rowOn{fill:#3A2416;stroke:var(--gold);stroke-width:1.4;}
      .egold{fill:none;stroke:#E0C58A;stroke-width:2.4;} .ecop{fill:none;stroke:#D98E6B;stroke-width:2.4;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="var(--bg)"/>
  <text x="48" y="60" font-size="28" class="tt">RAG vs DB 검색 <tspan font-size="17" class="ts">· 시나리오가 도구를 고른다</tspan></text>
  <line x1="640" y1="96" x2="640" y2="586" stroke="#4A3B2A" stroke-width="1" stroke-dasharray="4 7"/>

  <!-- ===== 왼쪽: RAG ===== -->
  <rect x="180" y="104" width="300" height="46" rx="23" class="go"/>
  <text x="330" y="133" font-size="18" text-anchor="middle" class="lbl">RAG · 지식검색 (7강)</text>
  <rect x="205" y="176" width="250" height="42" rx="21" class="card"/>
  <text x="330" y="203" font-size="15" text-anchor="middle" class="sub">"이 주제 설명해줘"</text>
  <path d="M330 220 L330 258" class="egold" marker-end="url(#ah)"/>

  <!-- 청크 더미: 뜻 가까운 몇 개만 강조 -->
  <rect x="150" y="266" width="360" height="150" rx="12" class="box"/>
  <rect x="172" y="284" width="96" height="34" rx="6" class="chunk"/>
  <rect x="282" y="284" width="96" height="34" rx="6" class="chunkOn"/>
  <rect x="392" y="284" width="96" height="34" rx="6" class="chunk"/>
  <rect x="172" y="330" width="96" height="34" rx="6" class="chunkOn"/>
  <rect x="282" y="330" width="96" height="34" rx="6" class="chunk"/>
  <rect x="392" y="330" width="96" height="34" rx="6" class="chunk"/>
  <rect x="172" y="376" width="96" height="34" rx="6" class="chunk"/>
  <rect x="282" y="376" width="96" height="34" rx="6" class="chunk"/>
  <rect x="392" y="376" width="96" height="34" rx="6" class="chunkOn"/>
  <text x="330" y="452" font-size="16" text-anchor="middle" class="lbl">뜻 가까운 <tspan fill="#E0C58A">'몇 개'</tspan>만 골라온다</text>
  <path d="M330 462 L330 492" class="egold" marker-end="url(#ah)"/>
  <rect x="195" y="500" width="270" height="46" rx="12" class="go"/>
  <text x="330" y="529" font-size="15.5" text-anchor="middle" class="lbl">→ 요약·근거로 답변</text>

  <!-- ===== 오른쪽: DB ===== -->
  <rect x="800" y="104" width="300" height="46" rx="23" class="cop"/>
  <text x="950" y="133" font-size="18" text-anchor="middle" class="lbl">DB 검색 · 조건 필터</text>
  <rect x="825" y="176" width="250" height="42" rx="21" class="card"/>
  <text x="950" y="203" font-size="15" text-anchor="middle" class="sub">"혈액형 문제 전부"</text>
  <path d="M950 220 L950 258" class="ecop" marker-end="url(#ac)"/>

  <!-- 표: 조건 맞는 행 전부 강조 -->
  <rect x="770" y="266" width="360" height="150" rx="12" class="box"/>
  <rect x="788" y="280" width="324" height="26" rx="5" class="rowOn"/>
  <rect x="788" y="312" width="324" height="26" rx="5" class="rowOn"/>
  <rect x="788" y="344" width="324" height="26" rx="5" class="chunk"/>
  <rect x="788" y="376" width="324" height="26" rx="5" class="rowOn"/>
  <text x="950" y="452" font-size="16" text-anchor="middle" class="lbl">조건 맞는 걸 <tspan fill="#D98E6B">'전부'</tspan> 가져온다</text>
  <path d="M950 462 L950 492" class="ecop" marker-end="url(#ac)"/>
  <rect x="815" y="500" width="270" height="46" rx="12" class="cop"/>
  <text x="950" y="529" font-size="15.5" text-anchor="middle" class="lbl">→ 전부 목록 → PDF</text>

  <!-- 하단 결론 -->
  <rect x="120" y="610" width="1040" height="58" rx="14" fill="var(--grp)" stroke="var(--edge)" stroke-width="1"/>
  <text x="640" y="646" font-size="16" text-anchor="middle" class="lbl">도구는 <tspan fill="#E0C58A">시나리오</tspan>가 고른다 — 문제은행엔 <tspan fill="#D98E6B">'DB'</tspan>가 맞았다 · RAG가 만능은 아니다</text>
</svg>
