<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">생성형 AI 지도 — 무엇을 만드느냐로 나눈 다섯 갈래</title>
  <desc id="d">중앙 생성형 AI 허브에서 다섯 갈래가 뻗는다. 글(답변·요약·초안, 골드 강조), 이미지(시안·썸네일), 음성(더빙·받아쓰기), 영상(클립·자막), 코드(스크립트·도구). 무엇을 만드느냐로 나누면 지도가 보인다.</desc>
  <defs>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#EDE4D6;font-weight:700;} .ts{fill:#B5A48D;}
      .lbl{fill:#EDE4D6;font-weight:700;} .sub{fill:#B5A48D;}
      .hub{fill:#2A2113;stroke:#E0C58A;stroke-width:2.4;}
      .node{fill:#271C12;stroke:#4A3B2A;stroke-width:1.6;}
      .nodeOn{fill:#2A2113;stroke:#E0C58A;stroke-width:2.4;}
      .spoke{stroke:#8FC7D8;stroke-width:2;fill:none;}
      .spokeOn{stroke:#E0C58A;stroke-width:3;fill:none;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#171009"/>
  <text x="48" y="64" font-size="30" class="tt">생성형 AI 지도</text>
  <text x="50" y="96" font-size="16" class="ts">"무엇을 만드느냐"가 곧 갈래다</text>

  <!-- 스포크 -->
  <path d="M640 355 L305 245" class="spokeOn"/>
  <path d="M640 355 L975 245" class="spoke"/>
  <path d="M640 355 L232 480" class="spoke"/>
  <path d="M640 355 L1048 480" class="spoke"/>
  <path d="M640 420 L640 545" class="spoke"/>

  <!-- 허브 -->
  <circle cx="640" cy="370" r="92" class="hub"/>
  <text x="640" y="362" font-size="22" text-anchor="middle" fill="#E0C58A" font-weight="700">생성형 AI</text>
  <text x="640" y="392" font-size="13" text-anchor="middle" class="sub">없던 걸 만든다</text>

  <!-- 글 (골드 강조, 좌상) -->
  <rect x="110" y="164" width="280" height="112" rx="16" class="nodeOn"/>
  <text x="140" y="210" font-size="20" fill="#E0C58A" font-weight="700">✍ 글</text>
  <text x="140" y="240" font-size="13.5" class="sub">답변 · 요약 · 초안</text>
  <text x="140" y="262" font-size="12.5" fill="#E0C58A">실무의 8할이 여기서 시작</text>

  <!-- 이미지 (우상) -->
  <rect x="900" y="164" width="270" height="106" rx="16" class="node"/>
  <text x="930" y="210" font-size="19" class="lbl">🖼 이미지</text>
  <text x="930" y="240" font-size="13.5" class="sub">그림 · 디자인 시안 · 썸네일</text>

  <!-- 음성 (좌하) -->
  <rect x="86" y="430" width="270" height="106" rx="16" class="node"/>
  <text x="116" y="476" font-size="19" class="lbl">🎙 음성</text>
  <text x="116" y="506" font-size="13.5" class="sub">더빙 · 안내 · 회의록 받아쓰기</text>

  <!-- 영상 (우하) -->
  <rect x="924" y="430" width="270" height="106" rx="16" class="node"/>
  <text x="954" y="476" font-size="19" class="lbl">🎬 영상</text>
  <text x="954" y="506" font-size="13.5" class="sub">짧은 클립 · 자막 · 편집 보조</text>

  <!-- 코드 (하단 중앙) -->
  <rect x="505" y="550" width="270" height="100" rx="16" class="node"/>
  <text x="535" y="594" font-size="19" class="lbl">⌨ 코드</text>
  <text x="535" y="622" font-size="13.5" class="sub">자동화 스크립트 · 간단한 도구</text>

  <!-- 보조 문구 -->
  <rect x="850" y="600" width="390" height="56" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="1045" y="635" font-size="15.5" text-anchor="middle" class="lbl"><tspan fill="#E0C58A">무엇을 만드느냐</tspan>로 나누면 지도가 보인다</text>
</svg>
