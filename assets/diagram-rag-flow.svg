<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">지식검색 작동 흐름 — 질문, 조각 찾기, 근거 삼기, 답변</title>
  <desc id="d">질문이 오면 자료창고에서 뜻이 가까운 조각을 찾고, 찾은 조각을 근거로 삼아 답변을 만든다. 근거를 먼저 찾고, 그다음 답을 만든다.</desc>
  <defs>
    <marker id="ac" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#8FC7D8"/></marker>
    <style><![CDATA[
      :root{ --bg:#171009; --grp:#1F1710; --card:#271C12; --edge:#4A3B2A;
             --ink:#EDE4D6; --dim:#B5A48D; --go:#E0C58A; --cy:#8FC7D8; }
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:var(--ink);font-weight:700;} .ts{fill:var(--dim);}
      .lbl{fill:var(--ink);font-weight:700;} .sub{fill:var(--dim);}
      .card{fill:var(--card);stroke:var(--edge);stroke-width:1.5;}
      .go{fill:#2A2113;stroke:var(--go);stroke-width:2;}
      .doc{fill:#211711;stroke:var(--edge);stroke-width:1.3;}
      .docOn{fill:#3A2E17;stroke:var(--go);stroke-width:1.8;}
      .arrow{fill:none;stroke:#8FC7D8;stroke-width:2.6;}
      .line{stroke:var(--dim);stroke-width:1.4;stroke-linecap:round;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="var(--bg)"/>
  <text x="48" y="64" font-size="30" class="tt">지식검색은 이렇게 움직인다</text>
  <text x="50" y="96" font-size="16" class="ts">4단계 — 질문 → 찾기 → 근거 → 답변</text>

  <!-- ① 질문 -->
  <rect x="60" y="270" width="230" height="150" rx="16" class="card"/>
  <text x="175" y="316" font-size="19" text-anchor="middle" class="lbl">① 질문</text>
  <rect x="88" y="336" width="174" height="42" rx="21" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="175" y="363" font-size="14" text-anchor="middle" class="sub">"경조휴가 며칠?"</text>
  <path d="M290 345 L342 345" class="arrow" marker-end="url(#ac)"/>

  <!-- ② 자료창고에서 조각 찾기 (돋보기 + 문서) -->
  <rect x="348" y="230" width="270" height="230" rx="16" class="card"/>
  <text x="483" y="272" font-size="19" text-anchor="middle" class="lbl">② 조각 찾기</text>
  <text x="483" y="296" font-size="13" text-anchor="middle" class="sub">자료창고에서 뜻이 가까운 것</text>
  <!-- 문서 더미 -->
  <rect x="380" y="316" width="62" height="78" rx="6" class="doc"/>
  <rect x="452" y="316" width="62" height="78" rx="6" class="docOn"/>
  <rect x="524" y="316" width="62" height="78" rx="6" class="doc"/>
  <line x1="392" y1="336" x2="430" y2="336" class="line" opacity=".5"/><line x1="392" y1="352" x2="430" y2="352" class="line" opacity=".5"/>
  <line x1="464" y1="336" x2="502" y2="336" class="line" opacity=".8"/><line x1="464" y1="352" x2="502" y2="352" class="line" opacity=".8"/>
  <line x1="536" y1="336" x2="574" y2="336" class="line" opacity=".5"/><line x1="536" y1="352" x2="574" y2="352" class="line" opacity=".5"/>
  <!-- 돋보기 (강조 문서 위) -->
  <circle cx="500" cy="408" r="24" fill="none" stroke="#E0C58A" stroke-width="4"/>
  <line x1="518" y1="426" x2="540" y2="446" stroke="#E0C58A" stroke-width="6" stroke-linecap="round"/>
  <path d="M618 345 L670 345" class="arrow" marker-end="url(#ac)"/>

  <!-- ③ 근거 삼기 (문서 3장 하이라이트) -->
  <rect x="676" y="230" width="270" height="230" rx="16" class="card"/>
  <text x="811" y="272" font-size="19" text-anchor="middle" class="lbl">③ 근거 삼기</text>
  <text x="811" y="296" font-size="13" text-anchor="middle" class="sub">찾은 조각을 질문 옆에 붙인다</text>
  <rect x="716" y="318" width="60" height="76" rx="6" class="docOn" transform="rotate(-6 746 356)"/>
  <rect x="781" y="314" width="60" height="76" rx="6" class="docOn"/>
  <rect x="846" y="318" width="60" height="76" rx="6" class="docOn" transform="rotate(6 876 356)"/>
  <text x="811" y="430" font-size="13" text-anchor="middle" class="sub" fill="#E0C58A">근거 3조각 확보</text>
  <path d="M946 345 L998 345" class="arrow" marker-end="url(#ac)"/>

  <!-- ④ 답변 -->
  <rect x="1004" y="270" width="216" height="150" rx="16" class="go"/>
  <text x="1112" y="322" font-size="19" text-anchor="middle" class="lbl">④ 답변 생성</text>
  <text x="1112" y="352" font-size="13.5" text-anchor="middle" class="sub">근거·출처와 함께</text>
  <text x="1112" y="376" font-size="13.5" text-anchor="middle" class="sub">우리 사정에 맞는 답</text>

  <!-- 보조 문구 -->
  <rect x="240" y="560" width="800" height="62" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="640" y="599" font-size="18" text-anchor="middle" class="lbl">근거를 <tspan fill="#E0C58A">먼저 찾고</tspan>, 그다음 답을 만든다</text>
</svg>
