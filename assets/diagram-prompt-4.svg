<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">프롬프트 4요소 — 맥락, 역할, 지시, 형식의 조립</title>
  <desc id="d">가운데 프롬프트 블록에 네 조각이 퍼즐처럼 결합한다. 맥락은 무슨 상황, 역할은 누구처럼, 지시는 무엇을 어떻게, 형식은 어떤 모양으로. 네 조각이 모이면 결과가 달라진다.</desc>
  <defs>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#EDE4D6;font-weight:700;} .ts{fill:#B5A48D;}
      .lbl{fill:#EDE4D6;font-weight:700;} .sub{fill:#B5A48D;}
      .core{fill:#2A2113;stroke:#E0C58A;stroke-width:2.4;}
      .piece{fill:#271C12;stroke:#4A3B2A;stroke-width:1.6;}
      .join{stroke:#8FC7D8;stroke-width:2.2;stroke-dasharray:2 6;stroke-linecap:round;fill:none;}
      .tag{fill:#8FC7D8;font-weight:700;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#171009"/>
  <text x="48" y="64" font-size="30" class="tt">프롬프트 4요소</text>
  <text x="50" y="96" font-size="16" class="ts">조각이 모일수록 결과가 선명해진다</text>

  <!-- 중앙 프롬프트 코어 -->
  <rect x="505" y="300" width="270" height="140" rx="18" class="core"/>
  <text x="640" y="360" font-size="26" text-anchor="middle" fill="#E0C58A" font-weight="700">프롬프트</text>
  <text x="640" y="396" font-size="13.5" text-anchor="middle" class="sub">= AI에게 건네는 지시문</text>

  <!-- 조각 1 · 맥락 (좌상) -->
  <rect x="160" y="150" width="300" height="118" rx="16" class="piece"/>
  <circle cx="460" cy="209" r="17" fill="#171009" stroke="#4A3B2A" stroke-width="1.6"/>
  <text x="192" y="196" font-size="14" class="tag">① 맥락</text>
  <text x="192" y="226" font-size="18" class="lbl">무슨 상황인가</text>
  <text x="192" y="252" font-size="13" class="sub">"신제품 출시를 앞둔 상황인데"</text>
  <path d="M420 268 C 460 290, 490 300, 520 312" class="join"/>

  <!-- 조각 2 · 역할 (우상) -->
  <rect x="820" y="150" width="300" height="118" rx="16" class="piece"/>
  <circle cx="820" cy="209" r="17" fill="#171009" stroke="#4A3B2A" stroke-width="1.6"/>
  <text x="866" y="196" font-size="14" class="tag">② 역할</text>
  <text x="866" y="226" font-size="18" class="lbl">누구처럼 볼 것인가</text>
  <text x="866" y="252" font-size="13" class="sub">"20년차 카피라이터처럼"</text>
  <path d="M860 268 C 820 290, 790 300, 760 312" class="join"/>

  <!-- 조각 3 · 지시 (좌하) -->
  <rect x="160" y="470" width="300" height="118" rx="16" class="piece"/>
  <circle cx="460" cy="529" r="17" fill="#171009" stroke="#4A3B2A" stroke-width="1.6"/>
  <text x="192" y="516" font-size="14" class="tag">③ 지시</text>
  <text x="192" y="546" font-size="18" class="lbl">무엇을 어떻게</text>
  <text x="192" y="572" font-size="13" class="sub">"홍보문구 3개를 써줘"</text>
  <path d="M420 470 C 460 448, 490 440, 520 428" class="join"/>

  <!-- 조각 4 · 형식 (우하) -->
  <rect x="820" y="470" width="300" height="118" rx="16" class="piece"/>
  <circle cx="820" cy="529" r="17" fill="#171009" stroke="#4A3B2A" stroke-width="1.6"/>
  <text x="866" y="516" font-size="14" class="tag">④ 형식</text>
  <text x="866" y="546" font-size="18" class="lbl">어떤 모양으로</text>
  <text x="866" y="572" font-size="13" class="sub">"각 20자 이내, 친근한 말투로"</text>
  <path d="M860 470 C 820 448, 790 440, 760 428" class="join"/>

  <!-- 보조 문구 -->
  <rect x="240" y="640" width="800" height="56" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="640" y="676" font-size="18" text-anchor="middle" class="lbl"><tspan fill="#E0C58A">네 조각</tspan>이 모이면 결과가 달라진다</text>
</svg>
