<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<rect x="240" y="30" width="200" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="54" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#0C447C">컨테이너</text>
<line x1="340" y1="78" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="110" y1="100" x2="570" y2="100" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="110" y1="100" x2="110" y2="128" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="263" y1="100" x2="263" y2="128" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="416" y1="100" x2="416" y2="128" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="570" y1="100" x2="570" y2="128" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="40" y="128" width="140" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="110" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">프로세스</text>
<text x="110" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">실행 주체</text>
<text x="110" y="189" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">호스트 커널이 생성</text>
<rect x="193" y="128" width="140" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="263" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">namespace</text>
<text x="263" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">시야 격리</text>
<text x="263" y="189" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">무엇을 볼 것인가</text>
<rect x="346" y="128" width="140" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="416" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">cgroup</text>
<text x="416" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">자원 제한</text>
<text x="416" y="189" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">얼마나 쓸 것인가</text>
<rect x="499" y="128" width="140" height="76" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="569" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">이미지</text>
<text x="569" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">파일시스템</text>
<text x="569" y="189" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">무엇이 보일 것인가</text>
<text x="340" y="240" text-anchor="middle" font-size="12" fill="#5F5E5A">커널에는 '컨테이너'라는 객체가 없다 — 프로세스에 이 설정들을 붙여둔 것을 Docker가 그렇게 부를 뿐이다</text>
<text x="340" y="266" text-anchor="middle" font-size="12" fill="#5F5E5A">네 가지 중 커널이 제공하는 것은 앞의 셋, Docker가 제공하는 것은 이미지 규격</text>
</svg>
