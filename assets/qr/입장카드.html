<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비전공자를 위한 기초공사 · 입장 QR</title>
<style>
  :root{ --bg:#171009; --ink:#EDE4D6; --dim:#B5A48D; --gold:#E0C58A; --copper:#D98E6B; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(80% 55% at 50% -8%, rgba(216,178,122,.10), transparent 68%),
      radial-gradient(70% 60% at 50% 120%, rgba(217,142,107,.08), transparent 70%),
      #171009;
    color:var(--ink);
    font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:32px 24px;text-align:center;overflow-y:auto;
  }
  .kicker{letter-spacing:.42em;font-size:14px;color:var(--gold);font-weight:700;text-indent:.42em}
  h1{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:.08em}
  .sub{color:var(--dim);font-size:clamp(14px,2.4vw,19px);margin-top:-10px}
  .qr-panel{
    background:#F3ECDD;border-radius:28px;padding:26px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(224,197,138,.35);
    width:min(62vmin,380px);flex:0 0 auto;
  }
  .qr-panel svg,.qr-panel img{width:100%;height:auto;display:block}
  .url{
    font-size:clamp(16px,2.6vw,22px);font-weight:700;letter-spacing:.02em;
    color:var(--gold);
    background:rgba(224,197,138,.08);border:1px solid rgba(224,197,138,.3);
    border-radius:999px;padding:12px 26px;
  }
  .how{color:var(--dim);font-size:clamp(13px,2vw,17px);line-height:1.6;max-width:520px}
  .how b{color:var(--ink);font-weight:700}
  .dots{display:flex;gap:8px;margin-top:2px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--copper);opacity:.55}
</style>
</head>
<body>
  <p class="kicker">SYSTEM PROGRAMMING · 16강</p>
  <h1>비전공자를 위한 기초공사</h1>
  <p class="sub">터미널부터 GitHub까지, 16강의 기록</p>

  <div class="qr-panel" aria-label="입장 QR 코드">
    <img src="codyssey-lecture-qr.svg" alt="비전공자를 위한 기초공사 입장 QR">
  </div>

  <div class="url">hyun02063185-ax-beginner.github.io/Codyssey_Lecture</div>
  <p class="how"><b>휴대폰 카메라</b>로 QR을 비추면 — <b>비전공자를 위한 기초공사</b>에 바로 입장합니다.<br>16강을 다 보면 완주 축하가 기다립니다.</p>
  <div class="dots"><i></i><i></i><i></i><i></i></div>
</body>
</html>
