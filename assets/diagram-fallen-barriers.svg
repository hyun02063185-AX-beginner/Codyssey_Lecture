<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">무너진 문턱 세 개 — 언어, 전문가, 비용</title>
  <desc id="d">사람 실루엣 앞에 기울어져 무너진 벽 세 개가 있다. 언어 장벽은 명령어에서 평소 말로, 전문가 장벽은 개발자에서 누구나로, 비용 장벽은 수개월에서 몇 분으로 무너졌다. 벽 너머에는 밝은 골드 빛이 비친다. 성능이 아니라 문턱이 달라졌다.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E0C58A" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#E0C58A" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#E0C58A" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#EDE4D6;font-weight:700;} .ts{fill:#B5A48D;}
      .lbl{fill:#EDE4D6;font-weight:700;} .sub{fill:#B5A48D;}
      .wall{fill:#271C12;stroke:#4A3B2A;stroke-width:1.8;}
      .strike{stroke:#8FC7D8;stroke-width:2;stroke-dasharray:6 5;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#171009"/>
  <text x="48" y="64" font-size="30" class="tt">무너진 문턱 세 개</text>
  <text x="50" y="96" font-size="16" class="ts">막고 있던 벽들이 동시에 넘어졌다</text>

  <!-- 벽 너머 골드 빛 -->
  <ellipse cx="1130" cy="380" rx="330" ry="300" fill="url(#glow)"/>
  <text x="1108" y="372" font-size="15" fill="#E0C58A" font-weight="700" text-anchor="middle">모두의</text>
  <text x="1108" y="396" font-size="15" fill="#E0C58A" font-weight="700" text-anchor="middle">도구</text>

  <!-- 사람 실루엣 (왼쪽) -->
  <circle cx="150" cy="330" r="34" fill="#B5A48D"/>
  <path d="M105 470 C 105 400, 195 400, 195 470 L 195 560 L 105 560 Z" fill="#B5A48D"/>
  <text x="150" y="608" font-size="14.5" text-anchor="middle" class="sub">실무자</text>

  <!-- 무너진 벽 1 · 언어 (크게 기울어짐) -->
  <g transform="rotate(24 420 460)">
    <rect x="330" y="270" width="180" height="380" rx="10" class="wall"/>
    <text x="420" y="420" font-size="19" text-anchor="middle" class="lbl">언어 장벽</text>
    <text x="420" y="452" font-size="13.5" text-anchor="middle" class="sub"><tspan text-decoration="line-through">명령어</tspan> → 평소 말</text>
  </g>

  <!-- 무너진 벽 2 · 전문가 -->
  <g transform="rotate(30 690 470)">
    <rect x="600" y="280" width="180" height="380" rx="10" class="wall"/>
    <text x="690" y="430" font-size="19" text-anchor="middle" class="lbl">전문가 장벽</text>
    <text x="690" y="462" font-size="13.5" text-anchor="middle" class="sub"><tspan text-decoration="line-through">개발자</tspan> → 누구나</text>
  </g>

  <!-- 무너진 벽 3 · 비용 -->
  <g transform="rotate(36 950 480)">
    <rect x="860" y="290" width="180" height="380" rx="10" class="wall"/>
    <text x="950" y="440" font-size="19" text-anchor="middle" class="lbl">비용 장벽</text>
    <text x="950" y="472" font-size="13.5" text-anchor="middle" class="sub"><tspan text-decoration="line-through">수개월</tspan> → 몇 분</text>
  </g>

  <!-- 나아가는 방향 점선 -->
  <path d="M215 470 C 400 560, 800 590, 1050 470" fill="none" class="strike"/>

  <!-- 보조 문구 -->
  <rect x="240" y="646" width="800" height="56" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="640" y="682" font-size="18" text-anchor="middle" class="lbl"><tspan fill="#E0C58A">성능</tspan>이 아니라 <tspan fill="#E0C58A">문턱</tspan>이 달라졌다</text>
</svg>
