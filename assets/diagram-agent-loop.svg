<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">에이전트 루프 — 목표, 관찰, 판단, 행동의 순환과 사람 확인 게이트</title>
  <desc id="d">목표에서 시작해 관찰(보기), 판단(생각), 행동(도구 실행)이 원형으로 순환하고, 행동한 결과를 다시 관찰한다. 위험한 행동 직전에는 루프 바깥의 사람 확인 게이트를 거친다. 본 것으로 다음을 정한다.</desc>
  <defs>
    <marker id="ac" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#8FC7D8"/></marker>
    <marker id="ag" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#E0C58A"/></marker>
    <style><![CDATA[
      :root{ --bg:#171009; --grp:#1F1710; --card:#271C12; --edge:#4A3B2A;
             --ink:#EDE4D6; --dim:#B5A48D; --go:#E0C58A; --cy:#8FC7D8; }
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:var(--ink);font-weight:700;} .ts{fill:var(--dim);}
      .lbl{fill:var(--ink);font-weight:700;} .sub{fill:var(--dim);}
      .card{fill:var(--card);stroke:var(--edge);stroke-width:1.5;}
      .goal{fill:#1F1710;stroke:var(--edge);stroke-width:1.5;}
      .gate{fill:#2A1A12;stroke:#E0C58A;stroke-width:2;}
      .loop{fill:none;stroke:#8FC7D8;stroke-width:2.6;}
      .gline{fill:none;stroke:#E0C58A;stroke-width:2.2;stroke-dasharray:6 6;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="var(--bg)"/>
  <text x="48" y="64" font-size="30" class="tt">에이전트는 "루프"로 움직인다</text>
  <text x="50" y="96" font-size="16" class="ts">목표 → 보기 → 생각 → 행동 → 다시 보기</text>

  <!-- 목표 (루프 진입) -->
  <rect x="70" y="150" width="180" height="86" rx="16" class="goal"/>
  <text x="160" y="188" font-size="18" text-anchor="middle" class="lbl">🎯 목표</text>
  <text x="160" y="214" font-size="12.5" text-anchor="middle" class="sub">"이상 있으면 알려줘"</text>
  <path d="M250 193 C 340 193, 380 200, 452 216" class="loop" marker-end="url(#ac)"/>

  <!-- 관찰 (위) -->
  <rect x="460" y="160" width="240" height="112" rx="18" class="card"/>
  <text x="580" y="206" font-size="20" text-anchor="middle" class="lbl">👀 관찰 <tspan font-size="14" class="sub">보기</tspan></text>
  <text x="580" y="236" font-size="13" text-anchor="middle" class="sub">데이터 · 검색 결과 · 화면</text>

  <!-- 판단 (우하) -->
  <rect x="880" y="360" width="240" height="112" rx="18" class="card"/>
  <text x="1000" y="406" font-size="20" text-anchor="middle" class="lbl">🤔 판단 <tspan font-size="14" class="sub">생각</tspan></text>
  <text x="1000" y="436" font-size="13" text-anchor="middle" class="sub">"충분한가? 뭘 더 볼까?"</text>

  <!-- 행동 (좌하) -->
  <rect x="180" y="360" width="240" height="112" rx="18" class="card"/>
  <text x="300" y="406" font-size="20" text-anchor="middle" class="lbl">⚙️ 행동 <tspan font-size="14" class="sub">도구 실행</tspan></text>
  <text x="300" y="436" font-size="13" text-anchor="middle" class="sub">검색 · 조회 · 작성</text>

  <!-- 순환 화살표: 관찰→판단 -->
  <path d="M700 232 C 850 260, 940 300, 990 352" class="loop" marker-end="url(#ac)"/>
  <!-- 판단→행동 (아래로, 게이트 경유 표시) -->
  <path d="M940 472 C 830 560, 470 560, 360 478" class="loop" marker-end="url(#ac)"/>
  <!-- 행동→관찰 (되돌아가기) -->
  <path d="M290 360 C 330 300, 400 260, 470 236" class="loop" marker-end="url(#ac)"/>
  <text x="332" y="292" font-size="13" fill="#8FC7D8">결과를 다시 본다</text>

  <!-- 사람 확인 게이트 (행동 직전 분기) -->
  <rect x="540" y="560" width="200" height="86" rx="16" class="gate"/>
  <text x="640" y="596" font-size="17" text-anchor="middle" class="lbl">🙋 사람 확인</text>
  <text x="640" y="622" font-size="12" text-anchor="middle" class="sub">발송·비용·계약 직전엔</text>
  <path d="M648 555 C 655 540, 660 532, 665 524" class="gline" marker-end="url(#ag)"/>
  <text x="758" y="600" font-size="12.5" fill="#E0C58A">위험한 행동 앞</text>
  <text x="758" y="618" font-size="12.5" fill="#E0C58A">여기서 멈춘다</text>

  <!-- 보조 문구 -->
  <rect x="770" y="150" width="450" height="66" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="995" y="178" font-size="16" text-anchor="middle" class="lbl">본 것으로 <tspan fill="#E0C58A">다음</tspan>을 정한다</text>
  <text x="995" y="201" font-size="13" text-anchor="middle" class="sub">위험한 행동 앞엔 사람 확인 — 이 되돌아감이 프롬프트엔 없다</text>
</svg>
