<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">초안 루프 — 백지에서 시작하지 않는다</title>
  <desc id="d">왼쪽의 흐린 백지에는 X 표시가 있다. 오른쪽 순환: 요점 던지기, AI 초안, 사람이 다듬기, 검증(숫자·출처), 필요시 다시 요청이 초안으로 복귀, 마지막 완성은 골드. 백지에서 시작하지 않는다 — 초안에서 시작한다.</desc>
  <defs>
    <marker id="ac" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#8FC7D8"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="8" refY="3.8" orient="auto"><path d="M0,0 L8,3.8 L0,7.6 Z" fill="#E0C58A"/></marker>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#D98E6B"/></marker>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#EDE4D6;font-weight:700;} .ts{fill:#B5A48D;}
      .lbl{fill:#EDE4D6;font-weight:700;} .sub{fill:#B5A48D;}
      .card{fill:#271C12;stroke:#4A3B2A;stroke-width:1.6;}
      .goal{fill:#2A2113;stroke:#E0C58A;stroke-width:2.4;}
      .flow{fill:none;stroke:#8FC7D8;stroke-width:2.4;}
      .back{fill:none;stroke:#D98E6B;stroke-width:2.2;stroke-dasharray:7 6;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#171009"/>
  <text x="48" y="64" font-size="30" class="tt">초안 루프</text>
  <text x="50" y="96" font-size="16" class="ts">쓰는 순서가 바뀌면, 시간의 무게가 옮겨간다</text>

  <!-- 좌측: 백지 (흐림 + X) -->
  <g opacity=".42">
    <rect x="90" y="230" width="200" height="270" rx="10" fill="#221A12" stroke="#4A3B2A" stroke-width="1.6"/>
    <line x1="118" y1="286" x2="240" y2="286" stroke="#3A2E20" stroke-width="2"/>
    <line x1="118" y1="322" x2="240" y2="322" stroke="#3A2E20" stroke-width="2"/>
    <text x="190" y="410" font-size="42" text-anchor="middle" class="ts">😶</text>
  </g>
  <line x1="110" y1="250" x2="272" y2="482" stroke="#D98E6B" stroke-width="5" stroke-linecap="round"/>
  <line x1="272" y1="250" x2="110" y2="482" stroke="#D98E6B" stroke-width="5" stroke-linecap="round"/>
  <text x="190" y="540" font-size="15" text-anchor="middle" fill="#D98E6B" font-weight="700">백지에서 시작 ✕</text>

  <!-- 우측 순환 -->
  <rect x="380" y="170" width="230" height="96" rx="16" class="card"/>
  <text x="410" y="210" font-size="18" class="lbl">① 요점 던지기</text>
  <text x="410" y="238" font-size="12.5" class="sub">핵심 몇 줄이면 충분</text>
  <path d="M610 218 L688 218" class="flow" marker-end="url(#ac)"/>

  <rect x="696" y="170" width="230" height="96" rx="16" class="card"/>
  <text x="726" y="210" font-size="18" class="lbl">② AI 초안</text>
  <text x="726" y="238" font-size="12.5" class="sub">구조와 문장이 생긴다</text>
  <path d="M811 266 C 811 300, 811 310, 811 336" class="flow" marker-end="url(#ac)"/>

  <rect x="696" y="342" width="230" height="96" rx="16" class="card"/>
  <text x="726" y="382" font-size="18" class="lbl">③ 사람이 다듬기</text>
  <text x="726" y="410" font-size="12.5" class="sub">내 말투 · 판단 · 강조</text>
  <path d="M811 438 C 811 472, 811 482, 811 508" class="flow" marker-end="url(#ac)"/>

  <rect x="696" y="514" width="230" height="96" rx="16" class="card"/>
  <text x="726" y="554" font-size="18" class="lbl">④ 검증</text>
  <text x="726" y="582" font-size="12.5" class="sub">숫자 · 출처 원자료 대조</text>

  <!-- 되돌아가기 (필요시 다시 요청 → 초안으로) -->
  <path d="M696 562 C 560 562, 520 380, 640 250 C 660 232, 672 226, 688 222" class="back" marker-end="url(#ar)"/>
  <text x="536" y="470" font-size="13" fill="#D98E6B">부족하면</text>
  <text x="536" y="490" font-size="13" fill="#D98E6B">다시 요청 ↺</text>

  <!-- 완성 (골드) -->
  <path d="M926 562 L1006 562" class="flow" marker-end="url(#ag)"/>
  <rect x="1014" y="514" width="190" height="96" rx="16" class="goal"/>
  <text x="1109" y="556" font-size="20" text-anchor="middle" fill="#E0C58A" font-weight="700">✓ 완성</text>
  <text x="1109" y="586" font-size="12.5" text-anchor="middle" class="sub">책임은 사람의 서명</text>

  <!-- 보조 문구 -->
  <rect x="330" y="646" width="620" height="56" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="640" y="682" font-size="17" text-anchor="middle" class="lbl">백지에서 시작하지 않는다 — <tspan fill="#E0C58A">초안에서 시작한다</tspan></text>
</svg>
