<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">입력 관문 — 넣기 전에 묻는다, 이게 밖으로 나가도 되는가</title>
  <desc id="d">문서들이 관문으로 향한다. 공개 정보, 익명화 자료, 내 메모는 통과(체크). 고객 개인정보, 미공개 실적·계약, 비밀번호·시스템 정보는 차단(X). 보호는 기술이 아니라 습관에서 시작된다.</desc>
  <defs>
    <marker id="ac" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#8FC7D8"/></marker>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#EDE4D6;font-weight:700;} .ts{fill:#B5A48D;}
      .lbl{fill:#EDE4D6;font-weight:700;} .sub{fill:#B5A48D;}
      .doc{fill:#271C12;stroke:#4A3B2A;stroke-width:1.5;}
      .ok{fill:#22301F;stroke:#8FC7D8;stroke-width:1.8;}
      .no{fill:#2A1A12;stroke:#D98E6B;stroke-width:1.8;}
      .gate{fill:#2A2113;stroke:#E0C58A;stroke-width:2.6;}
      .flow{fill:none;stroke:#8FC7D8;stroke-width:2;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#171009"/>
  <text x="48" y="64" font-size="30" class="tt">입력 관문</text>
  <text x="50" y="96" font-size="16" class="ts">AI에 넣기 전, 딱 한 번 멈춰 서는 곳</text>

  <!-- 관문 배너 -->
  <rect x="330" y="140" width="620" height="56" rx="14" class="gate"/>
  <text x="640" y="176" font-size="17" text-anchor="middle" fill="#E0C58A" font-weight="700">넣기 전에 묻는다 — "이게 밖으로 나가도 되는가?"</text>

  <!-- 관문 기둥 -->
  <rect x="600" y="220" width="18" height="360" rx="6" fill="#2A2113" stroke="#E0C58A" stroke-width="2"/>
  <rect x="662" y="220" width="18" height="360" rx="6" fill="#2A2113" stroke="#E0C58A" stroke-width="2"/>
  <text x="640" y="415" font-size="26" text-anchor="middle">🚪</text>

  <!-- 통과 (좌→우, 시안 체크) -->
  <rect x="120" y="236" width="240" height="64" rx="12" class="ok"/>
  <text x="146" y="276" font-size="15.5" class="lbl">공개 정보 <tspan fill="#8FC7D8">✓</tspan></text>
  <path d="M360 268 L588 268" class="flow" marker-end="url(#ac)"/>
  <rect x="710" y="236" width="200" height="64" rx="12" class="ok" opacity=".85"/>
  <text x="736" y="276" font-size="14.5" class="sub">→ AI에게 전달</text>

  <rect x="120" y="326" width="240" height="64" rx="12" class="ok"/>
  <text x="146" y="366" font-size="15.5" class="lbl">익명화 자료 <tspan fill="#8FC7D8">✓</tspan></text>
  <path d="M360 358 L588 358" class="flow" marker-end="url(#ac)"/>
  <rect x="710" y="326" width="200" height="64" rx="12" class="ok" opacity=".85"/>
  <text x="736" y="366" font-size="14.5" class="sub">→ 품질은 그대로</text>

  <rect x="120" y="416" width="240" height="64" rx="12" class="ok"/>
  <text x="146" y="456" font-size="15.5" class="lbl">내 메모·초안 <tspan fill="#8FC7D8">✓</tspan></text>
  <path d="M360 448 L588 448" class="flow" marker-end="url(#ac)"/>
  <rect x="710" y="416" width="200" height="64" rx="12" class="ok" opacity=".85"/>
  <text x="736" y="456" font-size="14.5" class="sub">→ 마음껏 활용</text>

  <!-- 차단 (관문 앞에서 멈춤, 코퍼 X — 은은하게) -->
  <rect x="120" y="520" width="240" height="56" rx="12" class="no"/>
  <text x="146" y="555" font-size="14.5" class="lbl">고객 개인정보 <tspan fill="#D98E6B">✕</tspan></text>
  <rect x="380" y="520" width="240" height="56" rx="12" class="no"/>
  <text x="406" y="555" font-size="14.5" class="lbl">미공개 실적·계약 <tspan fill="#D98E6B">✕</tspan></text>
  <rect x="120" y="592" width="500" height="56" rx="12" class="no"/>
  <text x="146" y="627" font-size="14.5" class="lbl">비밀번호 · 내부 시스템 정보 <tspan fill="#D98E6B">✕ — 관문 앞에서 멈춘다</tspan></text>

  <!-- 보조 문구 -->
  <rect x="700" y="560" width="520" height="88" rx="14" fill="#1F1710" stroke="#4A3B2A"/>
  <text x="960" y="596" font-size="17" text-anchor="middle" class="lbl">보호는 <tspan fill="#E0C58A">기술</tspan>이 아니라 <tspan fill="#E0C58A">습관</tspan>에서 시작된다</text>
  <text x="960" y="624" font-size="13" text-anchor="middle" class="sub">지우고 넣어도 결과가 같다면 — 지우는 게 정답</text>
</svg>
