<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">지식 검색(RAG) 구조 — 내 문서에서 찾아 근거로 답한다</title>
  <desc id="d">RAG는 두 단계다. ① 넣어두기: 내 문서를 잘게 나눠 임베딩해 벡터DB에 저장. ② 물어보기: 질문과 비슷한 문단을 검색해 그 근거로 답한다. 실제 예시는 한방자료 471문서.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#E0C58A"/>
    </marker>
    <style><![CDATA[
      /* 사유의 방 팔레트 — 따뜻한 흑갈 + 별빛 골드 */
      :root{ --bg:#171009; --grp:#1F1710; --card:#271C12; --edge:#4A3B2A;
             --ink:#EDE4D6; --dim:#B5A48D; --go:#E0C58A; --gold:#D98E6B; }
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:var(--ink);font-weight:700;} .ts{fill:var(--dim);}
      .pl{fill:var(--go);font-weight:700;} .lbl{fill:var(--ink);font-weight:600;} .sub{fill:var(--dim);}
      .card{fill:var(--card);stroke:var(--edge);stroke-width:1.5;}
      .go{stroke:var(--go);stroke-width:2;} .warm{stroke:var(--gold);stroke-width:2;}
      .edge{fill:none;stroke:#E0C58A;stroke-width:2.5;}
      .pill{fill:var(--grp);stroke:var(--edge);stroke-width:1;}
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="var(--bg)"/>

  <!-- header -->
  <text x="48" y="62" font-size="31" class="tt">지식 검색 (RAG) — 내 문서와 대화하기</text>
  <text x="50" y="96" font-size="16" class="ts">모델이 외워서 답하는 게 아니라, <tspan fill="#EDE4D6" font-weight="600">내 문서에서 찾아 ‘근거’로</tspan> 답한다</text>
  <rect x="980" y="40" width="256" height="40" rx="20" class="pill"/>
  <text x="1108" y="65" font-size="14" text-anchor="middle" class="sub">실제 예시 · 한방자료 471문서</text>

  <!-- ===== ① 인덱싱 ===== -->
  <text x="48" y="162" font-size="19" class="pl">① 넣어두기 — 인덱싱 (처음 한 번)</text>
  <rect x="48" y="180" width="250" height="92" rx="13" class="card"/>
  <text x="173" y="222" font-size="18" text-anchor="middle" class="lbl">내 문서</text>
  <text x="173" y="247" font-size="12.5" text-anchor="middle" class="sub">HWPX 한방자료 → TXT</text>

  <line x1="298" y1="226" x2="392" y2="226" class="edge" marker-end="url(#ah)"/>

  <rect x="396" y="180" width="300" height="92" rx="13" class="card"/>
  <text x="546" y="222" font-size="18" text-anchor="middle" class="lbl">잘게 나눠 임베딩</text>
  <text x="546" y="247" font-size="12.5" text-anchor="middle" class="sub">로컬 Ollama bge-m3 · Arc GPU</text>

  <line x1="696" y1="226" x2="790" y2="226" class="edge" marker-end="url(#ah)"/>

  <rect x="794" y="180" width="250" height="92" rx="13" class="card go"/>
  <text x="919" y="222" font-size="18" text-anchor="middle" class="lbl">벡터 DB</text>
  <text x="919" y="247" font-size="12.5" text-anchor="middle" class="sub">Dify · Weaviate 저장</text>

  <!-- connector: 인덱스 → 검색 -->
  <path d="M919 272 L919 316 L706 316 L706 360" class="edge" marker-end="url(#ah)"/>
  <text x="912" y="308" font-size="12" text-anchor="end" class="sub">저장된 인덱스를 검색에 사용</text>

  <!-- ===== ② 검색+생성 ===== -->
  <text x="48" y="352" font-size="19" class="pl">② 물어보기 — 검색 + 생성 (질문할 때마다)</text>
  <rect x="48" y="362" width="238" height="92" rx="13" class="card"/>
  <text x="167" y="404" font-size="18" text-anchor="middle" class="lbl">내 질문</text>
  <text x="167" y="429" font-size="12.5" text-anchor="middle" class="sub">“소함흉탕 임상례?”</text>

  <line x1="286" y1="408" x2="380" y2="408" class="edge" marker-end="url(#ah)"/>

  <rect x="384" y="362" width="244" height="92" rx="13" class="card"/>
  <text x="506" y="404" font-size="18" text-anchor="middle" class="lbl">NanoClaw 에이전트</text>
  <text x="506" y="429" font-size="12.5" text-anchor="middle" class="sub">dify_hanbang 검색 호출</text>

  <line x1="628" y1="408" x2="702" y2="408" class="edge" marker-end="url(#ah)"/>

  <rect x="706" y="362" width="244" height="92" rx="13" class="card"/>
  <text x="828" y="404" font-size="18" text-anchor="middle" class="lbl">비슷한 문단 검색</text>
  <text x="828" y="429" font-size="12.5" text-anchor="middle" class="sub">벡터 유사도 상위 몇 개</text>

  <line x1="950" y1="408" x2="1024" y2="408" class="edge" marker-end="url(#ah)"/>

  <rect x="1028" y="362" width="208" height="92" rx="13" class="card warm"/>
  <text x="1132" y="404" font-size="18" text-anchor="middle" class="lbl">근거로 답변</text>
  <text x="1132" y="429" font-size="12.5" text-anchor="middle" class="sub">출처 문서 함께</text>

  <!-- 지식베이스 3종 -->
  <text x="48" y="539" font-size="15" class="tt">같은 방식의 지식베이스</text>
  <rect x="372" y="514" width="200" height="40" rx="20" class="pill"/>
  <text x="472" y="539" font-size="13.5" text-anchor="middle" class="sub">한방자료 (471문서)</text>
  <rect x="588" y="514" width="270" height="40" rx="20" class="pill"/>
  <text x="723" y="539" font-size="13.5" text-anchor="middle" class="sub">과학문제은행 → 문제지 PDF</text>
  <rect x="874" y="514" width="160" height="40" rx="20" class="pill"/>
  <text x="954" y="539" font-size="13.5" text-anchor="middle" class="sub">보험약관</text>

  <!-- takeaway -->
  <rect x="48" y="600" width="1188" height="72" rx="14" style="fill:#1F1710;stroke:#4A3B2A;"/>
  <text x="72" y="634" font-size="16" class="lbl">핵심 · <tspan fill="#E0C58A">모델을 다시 학습시키지 않고</tspan>, 내 최신 문서에서 찾아 근거로 답한다.</text>
  <text x="72" y="658" font-size="13.5" class="sub">임베딩·검색을 내 GPU(로컬 Ollama)로 돌려 비용 0 · 문서가 늘면 인덱싱만 추가하면 된다.</text>
</svg>
