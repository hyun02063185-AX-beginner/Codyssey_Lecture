<rect x="735" y="950" width="205" height="46" rx="8" fill="#FDF4F0" stroke="#E0AC96" stroke-width="0.8"/>
<text x="837" y="978" text-anchor="middle" font-size="12.5" fill="#712B13">sudo — 필요할 때만</text>

