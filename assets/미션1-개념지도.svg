<text x="200" y="156" text-anchor="middle" font-size="15" font-weight="500" fill="#888780">여러 개를 묶어 실행</text>
<text x="200" y="178" text-anchor="middle" font-size="12" fill="#9A9A96">Docker Compose</text>
<rect x="360" y="130" width="280" height="66" rx="10" fill="#FAFAF8" stroke="#C9C8C2" stroke-width="1" stroke-dasharray="5 4"/>
<text x="500" y="156" text-anchor="middle" font-size="15" font-weight="500" fill="#888780">여러 서버에 나눠 배치</text>
