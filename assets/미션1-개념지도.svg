<text x="800" y="178" text-anchor="middle" font-size="12" fill="#9A9A96">CI/CD · 클라우드</text>

<line x1="500" y1="240" x2="500" y2="204" stroke="#888780" stroke-width="1.6" marker-end="url(#up)"/>

<text x="60" y="272" font-size="13" font-weight="600" fill="#0F6E56">컨테이너와 Docker · 10~12강</text>
<rect x="60" y="284" width="880" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="500" y="308" text-anchor="middle" font-size="18" font-weight="600" fill="#0C447C">컨테이너 = 프로세스 + namespace + cgroup + 이미지</text>
<text x="500" y="331" text-anchor="middle" font-size="12" fill="#185FA5">커널에는 &quot;컨테이너&quot;라는 것이 없습니다. Docker가 붙인 이름입니다</text>

<rect x="60" y="358" width="280" height="112" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="200" y="384" text-anchor="middle" font-size="16" font-weight="500" fill="#712B13">이미지 · 10강</text>
<text x="200" y="410" text-anchor="middle" font-size="12" fill="#993C1D">커널을 뺀 파일 묶음</text>
<text x="200" y="431" text-anchor="middle" font-size="12" fill="#993C1D">＋ 시작 설정(CMD 등)</text>
<text x="200" y="455" text-anchor="middle" font-size="12" fill="#993C1D">Dockerfile 로 만듭니다</text>

<rect x="360" y="358" width="280" height="112" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="500" y="384" text-anchor="middle" font-size="16" font-weight="500" fill="#3C3489">실행 동작 · 11강</text>
<text x="500" y="410" text-anchor="middle" font-size="12" fill="#534AB7">왜 바로 꺼지는가</text>
<text x="500" y="431" text-anchor="middle" font-size="12" fill="#534AB7">attach 와 exec 의 차이</text>
<text x="500" y="455" text-anchor="middle" font-size="12" fill="#534AB7">종료 코드 137</text>

<rect x="660" y="358" width="280" height="112" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="800" y="384" text-anchor="middle" font-size="16" font-weight="500" fill="#633806">연결 · 12강</text>
<text x="800" y="410" text-anchor="middle" font-size="12" fill="#854F0B">포트 매핑 — 경계의 문</text>
<text x="800" y="431" text-anchor="middle" font-size="12" fill="#854F0B">이름으로 통신</text>
<text x="800" y="455" text-anchor="middle" font-size="12" fill="#854F0B">볼륨 — 밖에 남기기</text>

<line x1="500" y1="514" x2="500" y2="478" stroke="#888780" stroke-width="1.6" marker-end="url(#up)"/>

<text x="60" y="546" font-size="13" font-weight="600" fill="#0F6E56">격리 기술 · 9강</text>
<rect x="60" y="558" width="430" height="124" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="275" y="586" text-anchor="middle" font-size="18" font-weight="600" fill="#085041">namespace</text>
<text x="275" y="612" text-anchor="middle" font-size="13" fill="#0F6E56">무엇을 볼 것인가 — 목록을 자릅니다</text>
<text x="275" y="640" text-anchor="middle" font-size="12" fill="#0F6E56">PID 번호 · IP와 포트 · 파일 경로</text>
<text x="275" y="663" text-anchor="middle" font-size="12" fill="#0F6E56">원래 하나뿐이던 것만 다시 매깁니다</text>

<rect x="510" y="558" width="430" height="124" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="725" y="586" text-anchor="middle" font-size="18" font-weight="600" fill="#633806">cgroup</text>
<text x="725" y="612" text-anchor="middle" font-size="13" fill="#854F0B">얼마나 쓸 것인가 — 상한을 정합니다</text>
<text x="725" y="640" text-anchor="middle" font-size="12" fill="#854F0B">CPU · 메모리 · 디스크</text>
<text x="725" y="663" text-anchor="middle" font-size="12" fill="#854F0B">메모리는 자를 필요가 없어 여기 있습니다</text>

<line x1="500" y1="726" x2="500" y2="690" stroke="#888780" stroke-width="1.6" marker-end="url(#up)"/>

<text x="60" y="758" font-size="13" font-weight="600" fill="#0F6E56">커널이 하는 네 가지 일 · 5~8강</text>

