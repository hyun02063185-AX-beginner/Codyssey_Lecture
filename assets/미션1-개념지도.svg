<rect x="510" y="950" width="205" height="46" rx="8" fill="#FDF7EB" stroke="#DDBE86" stroke-width="0.8"/>
<text x="612" y="978" text-anchor="middle" font-size="12.5" fill="#633806">DNS — 이름을 주소로</text>

<rect x="735" y="770" width="205" height="58" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
