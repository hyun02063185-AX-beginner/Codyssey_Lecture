<defs><marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="500" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#2C2C2A">미션 1 개념 지도</text>
<text x="500" y="74" text-anchor="middle" font-size="14" fill="#5F5E5A">아래에서 위로 읽으세요 — 무엇 위에 무엇이 얹혀 있는가</text>

<text x="60" y="118" font-size="13" font-weight="600" fill="#888780">그 위에 쌓이는 것들 · 이 강의 다음</text>
