<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect x="0" y="0" width="680" height="340" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="60" y="36" font-size="12" fill="#5F5E5A">사용자 공간 — 특권 없음</text>
<rect x="60" y="50" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="150" y="69" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">부모 프로세스</text>
<text x="150" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">bash, dockerd, runc</text>
<rect x="440" y="50" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="530" y="69" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">자식 프로세스</text>
<text x="530" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">새 PID 부여됨</text>
<line x1="150" y1="110" x2="150" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530" y1="196" x2="530" y2="112" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="164" y="134" font-size="12" fill="#5F5E5A">fork / clone 요청</text>
<text x="440" y="134" font-size="12" fill="#5F5E5A">생성 결과</text>
<line x1="40" y1="150" x2="640" y2="150" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="640" y="144" text-anchor="end" font-size="12" fill="#5F5E5A">시스템 콜 경계</text>
