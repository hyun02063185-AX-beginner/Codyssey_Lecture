<text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">커널 — 특권 모드</text>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">메모리 할당, PID 부여, 스케줄링, namespace 설정</text>
<text x="340" y="290" text-anchor="middle" font-size="12" fill="#5F5E5A">요청은 프로세스가, 생성은 커널이 — 예외는 부팅 때 커널이 직접 만드는 PID 1</text>
