<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">휴먼인더루프 — 위험 앞에서 사람에게 확인받는다</title>
  <desc id="d">에이전트는 조회·요약·초안 같은 안전한 일은 바로 하지만, 자동 발송·광고비 집행·계약 변경·공식 게시 같은 위험한 일은 실행 전에 사람에게 확인받는다. 이 사람 확인 지점을 휴먼인더루프(Human-in-the-loop)라 한다.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#E0C58A"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#D98E6B"/></marker>
    <style><![CDATA[
      :root{ --bg:#171009; --grp:#1F1710; --card:#271C12; --edge:#4A3B2A;
             --ink:#EDE4D6; --dim:#B5A48D; --go:#E0C58A; --gold:#D98E6B; }
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:var(--ink);font-weight:700;} .ts{fill:var(--dim);}
      .lbl{fill:var(--ink);font-weight:600;} .sub{fill:var(--dim);}
      .card{fill:var(--card);stroke:var(--edge);stroke-width:1.5;}
      .go{fill:var(--card);stroke:var(--go);stroke-width:2;}
      .warm{fill:#2A1A12;stroke:var(--gold);stroke-width:2.2;}
      .egold{fill:none;stroke:#E0C58A;stroke-width:2.5;} .ecop{fill:none;stroke:#D98E6B;stroke-width:2.5;}
      .pill{fill:var(--grp);stroke:var(--edge);stroke-width:1;}
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="var(--bg)"/>
  <text x="48" y="60" font-size="30" class="tt">휴먼인더루프 <tspan font-size="18" class="ts">Human-in-the-loop</tspan></text>
  <text x="50" y="92" font-size="16" class="ts">좋은 에이전트는 <tspan fill="#EDE4D6" font-weight="600">위험 앞에서 멈추고, 사람에게 확인받는다</tspan></text>

  <!-- 에이전트 -->
  <rect x="48" y="250" width="210" height="96" rx="14" class="go"/>
  <text x="153" y="292" font-size="18" text-anchor="middle" class="lbl">에이전트</text>
  <text x="153" y="318" font-size="12.5" text-anchor="middle" class="sub">판단 → 도구 실행</text>

  <!-- 안전한 일 (위, 골드) -->
  <path d="M258 282 C 300 282, 320 170, 362 170" class="egold" marker-end="url(#ah)"/>
  <rect x="366" y="132" width="300" height="76" rx="12" class="card"/>
  <text x="516" y="163" font-size="15.5" text-anchor="middle" class="lbl">안전한 일 — 조회·요약·초안</text>
  <text x="516" y="187" font-size="12.5" text-anchor="middle" class="sub">되돌리기 쉬움</text>
  <path d="M666 170 L712 170" class="egold" marker-end="url(#ah)"/>
  <rect x="716" y="132" width="180" height="76" rx="12" class="go"/>
  <text x="806" y="176" font-size="15.5" text-anchor="middle" class="lbl">바로 실행 ✓</text>

  <!-- 위험한 일 (아래, 구리) -->
  <path d="M258 314 C 300 314, 320 430, 362 430" class="ecop" marker-end="url(#ac)"/>
  <rect x="366" y="392" width="300" height="90" rx="12" class="warm"/>
  <text x="516" y="421" font-size="15.5" text-anchor="middle" class="lbl" style="fill:#F0C4A8">위험한 일 · 권한 큰 일</text>
  <text x="516" y="445" font-size="12" text-anchor="middle" class="sub">자동 발송 · 광고비 집행</text>
  <text x="516" y="464" font-size="12" text-anchor="middle" class="sub">계약 변경 · 공식 입장 게시</text>
  <path d="M666 437 L712 437" class="ecop" marker-end="url(#ac)"/>

  <!-- 사람 확인 게이트 -->
  <rect x="716" y="388" width="200" height="98" rx="14" class="warm"/>
  <text x="816" y="424" font-size="17" text-anchor="middle" class="lbl" style="fill:#F0C4A8">🔒 사람 확인</text>
  <text x="816" y="450" font-size="12.5" text-anchor="middle" class="sub">실행 전, 사람이 승인</text>
  <text x="816" y="470" font-size="11.5" text-anchor="middle" class="sub">= 휴먼인더루프 지점</text>
  <path d="M916 437 L968 437" class="ecop" marker-end="url(#ac)"/>
  <rect x="972" y="392" width="234" height="90" rx="12" class="card"/>
  <text x="1089" y="423" font-size="14.5" text-anchor="middle" class="lbl">승인 → 실행 · 반려 → 멈춤</text>
  <text x="1089" y="447" font-size="12" text-anchor="middle" class="sub">사람이 최종 판단</text>
  <text x="1089" y="466" font-size="12" text-anchor="middle" class="sub">(초안까지만도 정상)</text>

  <!-- 두 단계 설계 -->
  <rect x="48" y="520" width="580" height="66" rx="12" class="pill"/>
  <text x="70" y="548" font-size="13.5" class="lbl">[기본] 발송 도구를 안 준다</text>
  <text x="70" y="571" font-size="12" class="sub">→ 초안까지만 만든다 (사람이 직접 보냄)</text>
  <rect x="656" y="520" width="580" height="66" rx="12" class="pill"/>
  <text x="678" y="548" font-size="13.5" class="lbl">[한 단계 위] 발송 도구는 주되</text>
  <text x="678" y="571" font-size="12" class="sub">→ 사람 확인 후에만 발송 · 둘 다 정상 작동하는 에이전트</text>

  <rect x="48" y="606" width="1188" height="64" rx="14" style="fill:#1F1710;stroke:#4A3B2A;"/>
  <text x="72" y="644" font-size="16" class="lbl">핵심 · AI를 <tspan fill="#D98E6B">믿느냐</tspan>가 아니라 — <tspan fill="#E0C58A">어디서 사람에게 확인받게 설계하느냐.</tspan></text>
</svg>
