<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>
<rect x="30" y="18" width="150" height="118" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="105" y="48" text-anchor="middle" font-size="15" font-weight="500" fill="#3C3489">담기</text>
<text x="105" y="74" text-anchor="middle" font-size="12" fill="#534AB7">파일</text>
<text x="105" y="100" text-anchor="middle" font-size="12" fill="#534AB7">어디에 무엇을</text>
<text x="105" y="120" text-anchor="middle" font-size="12" fill="#534AB7">두는가</text>
<rect x="197" y="18" width="150" height="118" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="272" y="48" text-anchor="middle" font-size="15" font-weight="500" fill="#085041">실행</text>
<text x="272" y="74" text-anchor="middle" font-size="12" fill="#0F6E56">프로세스</text>
<text x="272" y="100" text-anchor="middle" font-size="12" fill="#0F6E56">언제 시작하고</text>
<text x="272" y="120" text-anchor="middle" font-size="12" fill="#0F6E56">언제 멈추는가</text>
<rect x="364" y="18" width="150" height="118" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="439" y="48" text-anchor="middle" font-size="15" font-weight="500" fill="#633806">주고받기</text>
<text x="439" y="74" text-anchor="middle" font-size="12" fill="#854F0B">네트워크</text>
