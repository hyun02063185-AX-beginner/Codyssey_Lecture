<text x="439" y="120" text-anchor="middle" font-size="12" fill="#854F0B">보내는가</text>
<rect x="531" y="18" width="150" height="118" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="606" y="48" text-anchor="middle" font-size="15" font-weight="500" fill="#712B13">통제</text>
<text x="606" y="74" text-anchor="middle" font-size="12" fill="#993C1D">권한 · 격리</text>
<text x="606" y="100" text-anchor="middle" font-size="12" fill="#993C1D">누가 무엇까지</text>
<text x="606" y="120" text-anchor="middle" font-size="12" fill="#993C1D">할 수 있는가</text>
<line x1="105" y1="140" x2="105" y2="162" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="272" y1="140" x2="272" y2="162" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="439" y1="140" x2="439" y2="162" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="606" y1="140" x2="606" y2="162" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="105" y1="162" x2="606" y2="162" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="355" y1="162" x2="355" y2="186" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="30" y="190" width="620" height="58" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="214" text-anchor="middle" font-size="16" font-weight="500" fill="#085041">이 네 가지를 담당하는 것이 커널이다</text>
<text x="340" y="236" text-anchor="middle" font-size="12" fill="#0F6E56">하드웨어를 직접 다루는 유일한 소프트웨어</text>
<rect x="30" y="260" width="620" height="46" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="286" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">커널 + 사용자 도구(셸, 명령어, 라이브러리) = 운영체제(OS)</text>
</svg>
