<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="32" font-size="12" fill="#5F5E5A">컨테이너 안에서 보이는 번호 — PID namespace마다 따로</text>
<rect x="40" y="46" width="190" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="62" y="72" font-size="14" font-weight="500" fill="#3C3489">컨테이너 A</text>
<text x="62" y="100" font-size="12" fill="#534AB7">PID 1 = nginx</text>
<text x="62" y="122" font-size="12" fill="#534AB7">PID 12 = worker</text>
<text x="62" y="144" font-size="12" fill="#534AB7">B와 C는 안 보임</text>
<rect x="245" y="46" width="190" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="267" y="72" font-size="14" font-weight="500" fill="#3C3489">컨테이너 B</text>
<text x="267" y="100" font-size="12" fill="#534AB7">PID 1 = redis</text>
<text x="267" y="122" font-size="12" fill="#534AB7">—</text>
<text x="267" y="144" font-size="12" fill="#534AB7">A와 C는 안 보임</text>
<rect x="450" y="46" width="190" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="472" y="72" font-size="14" font-weight="500" fill="#3C3489">컨테이너 C</text>
<text x="472" y="100" font-size="12" fill="#534AB7">PID 1 = bash</text>
<text x="472" y="122" font-size="12" fill="#534AB7">—</text>
<text x="472" y="144" font-size="12" fill="#534AB7">A와 B는 안 보임</text>
<line x1="135" y1="162" x2="135" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="162" x2="340" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="545" y1="162" x2="545" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="226" width="600" height="112" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="62" y="252" font-size="14" font-weight="500" fill="#085041">호스트 커널의 실제 PID 표 — 번호는 하나뿐</text>
<text x="62" y="282" font-size="12" fill="#0F6E56">PID 1 = systemd</text>
<text x="62" y="308" font-size="12" fill="#0F6E56">PID 5104 = redis</text>
<text x="360" y="282" font-size="12" fill="#0F6E56">PID 4823 = nginx</text>
<text x="360" y="308" font-size="12" fill="#0F6E56">PID 5390 = bash</text>
<text x="340" y="364" text-anchor="middle" font-size="12" fill="#5F5E5A">같은 프로세스가 번호를 두 개 가짐 — 호스트는 전부 보고, 컨테이너는 자기 것만 봄</text>
</svg>
